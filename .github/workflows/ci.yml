name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the service with its test tools
        run: python -m pip install -e "service[dev]"
      - name: Lint (service, plugin, scripts)
        working-directory: service
        run: ruff check ..
      - name: Tests (those needing Cura or CuraEngine skip themselves)
        working-directory: service
        run: python -m pytest -q
