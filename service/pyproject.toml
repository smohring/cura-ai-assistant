[project]
name = "cura-ai-service"
version = "0.1.0"
description = "Local service behind the Cura AI assistant: settings dialogue and orientation."
requires-python = ">=3.11"
authors = [{ name = "Steffen Mohring" }]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = ["pydantic>=2.14", "numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cura_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Claude CLI; opt in with CURA_AI_LIVE=1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
